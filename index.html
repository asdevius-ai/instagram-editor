<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Макет Insta">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Макет профілю</title>
<style>
:root{
  --bg:#fff;--fg:#111;--muted:#737373;--line:#dbdbdb;--soft:#efefef;--accent:#0095f6;--danger:#ed4956;--card:#fff;--tag:#00376b;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--fg:#f5f5f5;--muted:#a8a8a8;--line:#262626;--soft:#262626;--card:#121212;--tag:#e0f1ff}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(64px + var(--safe-b));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--fg)}
.wrap{max-width:560px;margin:0 auto}
.hide{display:none!important}
.tag,.link{color:var(--tag)}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700;border-bottom:1px solid var(--line)}
.top .un{display:flex;align-items:center;gap:4px;flex:1;min-width:0;cursor:pointer}
.top .un>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .chev{width:14px;height:14px;flex:none}
.top .ic{width:26px;height:26px;display:grid;place-items:center;margin-left:14px;flex:none}
.top .ic svg{width:26px;height:26px}
.badge{width:14px;height:14px;vertical-align:-1px;margin-left:4px;flex:none}
.editor{display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--soft);font-size:12px;color:var(--muted);overflow-x:auto;scrollbar-width:none}
.editor::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px dashed var(--muted);border-radius:16px;padding:4px 10px;font-size:13px;color:var(--fg);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-style:solid}

/* profile */
.prof{padding:14px 16px 0}
.row1{display:flex;align-items:center;gap:18px}
.avatar{width:86px;height:86px;border-radius:50%;background:var(--soft) center/cover;flex:none;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.avwrap{padding:3px;border-radius:50%;flex:none;cursor:pointer}
.avwrap .avatar{width:80px;height:80px}
.avwrap.ring,.avs.ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.avwrap.ring .avatar,.avs.ring .avatar{border:3px solid var(--bg)}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}
.stats span{font-size:13px}
.name{font-weight:600;margin-top:12px}
.cat{color:var(--muted);font-size:14px}
.bio{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.link{font-weight:600;word-break:break-all}
.lk{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.pro{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:12px;display:grid;gap:1px}
.pro span{font-size:13px}
.pro small{color:var(--muted);font-size:12px}
.btns{display:flex;gap:6px;margin:14px 0}
.btn{flex:1;background:var(--soft);border-radius:8px;padding:8px 6px;font-weight:600;text-align:center;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.on{background:var(--fg);color:var(--bg)}
.btn.danger{color:var(--danger)}
.btn.sq{flex:none;width:38px;padding:0;display:grid;place-items:center}
.btn.sq svg{width:18px;height:18px}
.hl{display:flex;gap:14px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hl button{flex:none;width:68px;text-align:center;font-size:12px}
.hl .c{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);margin:0 auto 4px;background:var(--soft) center/cover;display:grid;place-items:center;font-size:28px;color:var(--muted);padding:3px;background-clip:content-box}
.hl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs div{flex:1;display:grid;place-items:center;padding:10px 0;color:var(--muted);cursor:pointer}
.tabs div.a{color:var(--fg);box-shadow:inset 0 -1px 0 var(--fg)}
.tabs svg{width:24px;height:24px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{position:relative;aspect-ratio:3/4;background:var(--soft) center/cover;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grid.reels .cell{aspect-ratio:9/16}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cell .car{position:absolute;top:6px;right:6px;width:20px;height:20px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.cell .pin{position:absolute;top:6px;left:6px;width:18px;height:18px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.cell .views{position:absolute;left:6px;bottom:6px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 0 3px rgba(0,0,0,.7)}
.cell.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:scale(1.06)}
.cell.ph{opacity:.25}
.reorder .cell{touch-action:none}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
.nav button{flex:1;padding:10px 0 8px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted)}
.nav button.a{color:var(--fg);font-weight:600}
.nav svg{width:26px;height:26px}
body.clean .editor,body.clean .nav{display:none!important}
body.clean{padding-bottom:var(--safe-b)}
#exitClean{display:none;position:fixed;right:12px;bottom:calc(12px + var(--safe-b));width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;z-index:9;place-items:center;font-size:16px}
body.clean #exitClean{display:grid}

/* transfer view */
.pad{padding:16px}
h2{font-size:18px;margin:22px 0 6px}
h2:first-child{margin-top:0}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.step{display:flex;gap:10px;align-items:flex-start}
.step .th{width:60px;aspect-ratio:3/4;border-radius:6px;background:var(--soft);flex:none;position:relative;overflow:hidden}
.step .th img,.step .th video,.srow .th img,.srow .th video,.hl .c img,.hl .c video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.hl .c img,.hl .c video{border-radius:50%}
.step .tx{flex:1;min-width:0}
.step .tx .cap{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.step .tx .t{font-weight:600}
.step .act{display:flex;gap:6px;flex-wrap:wrap}
.step .act .btn{flex:none;padding:6px 10px;font-size:13px}
.step.done{opacity:.5}
.field{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border:0}
.field .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.field .btn{flex:none;padding:6px 12px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet .bar b{font-size:17px}
.sheet .bar button{color:var(--accent);font-weight:600}
label.f{display:block;margin:10px 0}
label.f small{display:block;color:var(--muted);margin-bottom:3px}
label.f input,label.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px}
label.f textarea{min-height:92px;resize:vertical}
label.f.chk{display:flex;align-items:center;gap:10px}
label.f.chk input{width:auto;margin:0;transform:scale(1.25)}
.cnt{float:right}
.pic{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.pic .avatar{width:64px;height:64px}
.sheet h3{font-size:16px;margin:16px 0 6px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-bottom:6px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:72%;scroll-snap-align:center;position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft)}
.slides.one .slide{width:100%}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.slide .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:18px;display:grid;place-items:center}
.slide .play{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
.pos{display:flex;align-items:center;gap:8px;margin:8px 0}
.pos span{flex:1;text-align:center;color:var(--muted)}
.pos .btn{flex:none;width:96px}
.srow{display:flex;align-items:center;gap:8px;margin:6px 0}
.srow .th{width:42px;aspect-ratio:9/16;border-radius:6px;background:var(--soft);flex:none;position:relative;overflow:hidden}
.srow .th i{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px;text-shadow:0 0 3px #000}
.srow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:16px}
.srow .x{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.acc{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.acc .avatar{width:48px;height:48px}
.acc .who2{flex:1;min-width:0;line-height:1.25}
.acc .who2 small{display:block;color:var(--muted)}
.acc .ok{color:var(--accent);font-weight:700}
.acc .x{width:32px;height:32px;display:grid;place-items:center;color:var(--danger)}

/* feed viewer */
#viewer,#archive{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#viewer .vwrap,#archive .vwrap{max-width:560px;margin:0 auto;padding-bottom:calc(30px + var(--safe-b))}
.vtop{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(8px + var(--safe-t)) 12px 8px;border-bottom:1px solid var(--line)}
.vtop .ic{width:28px;height:28px;display:grid;place-items:center}
.vtop .ic svg{width:26px;height:26px}
.vtop div{flex:1;text-align:center;margin-right:40px;line-height:1.15}
.vtop small{display:block;color:var(--muted);font-size:12px}
.vtop b{font-size:16px}
.fp{scroll-margin-top:calc(56px + var(--safe-t));padding-bottom:14px}
.fh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.avs{padding:2px;border-radius:50%;flex:none}
.avs .avatar{width:32px;height:32px;border:0}
.avs.ring .avatar{border-width:2px}
.who{flex:1;min-width:0;line-height:1.2}
.who b{font-size:14px}
.who small{display:block;font-size:12px}
.ic{display:grid;place-items:center}
.fh .ic{width:28px;height:28px}
.fh .ic svg{width:22px;height:22px}
.fm{position:relative}
.fslides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.fslides::-webkit-scrollbar{display:none}
.fslide{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:4/5;background:var(--soft);position:relative}
.fslide img,.fslide video{width:100%;height:100%;object-fit:cover;display:block}
.fslide .mute{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:13px;pointer-events:none}
.pager{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);color:#fff;border-radius:12px;padding:2px 9px;font-size:12px}
.acts{display:flex;align-items:center;gap:14px;padding:10px 12px 6px;position:relative}
.acts .ic{width:26px;height:26px}
.acts .ic svg{width:26px;height:26px}
.acts .ic:last-child{margin-left:auto}
.ic.lk-on svg{fill:#ed4956;stroke:#ed4956}
.ic.sv-on svg{fill:currentColor}
.dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5}
.dots i.a{background:var(--accent);opacity:1}
.likes,.fc,.cm,.dt{padding:0 12px}
.likes{font-size:14px;margin-bottom:4px;display:flex;align-items:center}
.stack{display:inline-flex;margin-right:6px}
.stack i{width:18px;height:18px;border-radius:50%;border:2px solid var(--bg);margin-left:-6px;color:#fff;font-size:9px;font-style:normal;display:grid;place-items:center;font-weight:700}
.stack i:first-child{margin-left:0}
.fc{font-size:14px;white-space:pre-wrap;word-break:break-word}
.fc .more{color:var(--muted);font-size:14px}
.cm{color:var(--muted);font-size:14px;margin-top:4px}
.dt{color:var(--muted);font-size:11px;margin-top:4px}

.cell .ck{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);color:#fff;font-size:13px;line-height:18px;text-align:center;font-weight:700}
.cell.sel .ck{background:var(--accent);border-color:var(--accent)}
.cell.sel img,.cell.sel video{opacity:.6}
body.selecting{padding-bottom:calc(128px + var(--safe-b))}
#selbar{position:fixed;left:0;right:0;bottom:calc(56px + var(--safe-b));z-index:7;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 16px;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
#selbar span{flex:1;font-weight:600}
#selbar .btn{flex:none;padding:8px 14px}
.menu .row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.menu .row b{flex:1;font-weight:500}
.menu .row small{color:var(--muted)}

/* cropper */
#cropper{position:fixed;inset:0;z-index:25;background:#000;color:#fff;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 16px 10px;font-weight:600;font-size:16px}
.ctop button{padding:6px 2px;font-size:16px;color:#fff}
.ctop .cok{color:#0095f6;font-weight:700}
.cstage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#111}
.cstage img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.cframe{position:absolute;border:2px solid #fff;box-shadow:0 0 0 3000px rgba(0,0,0,.62);pointer-events:none}
.cframe::before,.cframe::after{content:"";position:absolute;inset:0;pointer-events:none}
.cframe::before{background:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.cframe::after{background:linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.cbot{padding:12px 18px calc(14px + var(--safe-b));display:grid;gap:12px}
.cbot input[type=range]{width:100%;accent-color:#fff}
.cratios{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cratios button{padding:6px 14px;border-radius:16px;border:1px solid #666;font-size:14px;color:#fff}
.cratios button.on{background:#fff;color:#000;border-color:#fff}
.crow{display:flex;gap:8px;justify-content:center}
.crow button{flex:1;padding:9px 6px;border-radius:8px;background:#262626;color:#fff;font-size:14px;font-weight:600}
.slide .cr{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:15px;display:grid;place-items:center}

/* reels viewer */
#rviewer{position:fixed;inset:0;z-index:16;background:#000;color:#fff}
#rlist{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.rl{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#000}
.rmedia{position:absolute;top:0;bottom:0;left:50%;width:100%;max-width:560px;transform:translateX(-50%)}
.rmedia video,.rmedia img{width:100%;height:100%;object-fit:cover;display:block}
.rl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.rtop{position:absolute;top:0;left:0;right:0;z-index:3;padding:calc(10px + var(--safe-t)) 12px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(0,0,0,.45),transparent);font-weight:700;font-size:18px}
.rtop .ic{width:28px;height:28px}
.rtop .ic svg{width:26px;height:26px}
.rtop .grow{flex:1}
.rside{position:absolute;right:10px;bottom:calc(28px + var(--safe-b));display:grid;gap:18px;justify-items:center;z-index:2}
.rside button{display:grid;justify-items:center;gap:2px;font-size:12px;color:#fff}
.rside svg{width:28px;height:28px;filter:drop-shadow(0 0 3px rgba(0,0,0,.5))}
.rbot{position:absolute;left:12px;right:72px;bottom:calc(24px + var(--safe-b));z-index:2;text-shadow:0 0 4px rgba(0,0,0,.6);font-size:14px}
.rwho{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.rwho .avatar{width:32px;height:32px;border:1px solid #fff}
.rcap{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.rcap .tag{color:#fff;font-weight:600}
.raudio{margin-top:6px;font-size:12px;opacity:.9}

/* stories viewer */
#sviewer{position:fixed;inset:0;z-index:17;background:#000;color:#fff;display:flex;justify-content:center}
.sv{position:relative;width:100%;max-width:480px;height:100%;background:#111;overflow:hidden}
.smedia{position:absolute;inset:0}
.smedia img,.smedia video{width:100%;height:100%;object-fit:cover;display:block}
.sbars{position:absolute;top:calc(8px + var(--safe-t));left:8px;right:8px;display:flex;gap:4px;z-index:3}
.sbars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.sbars b{display:block;height:100%;width:0;background:#fff}
.shead{position:absolute;top:calc(18px + var(--safe-t));left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:4;text-shadow:0 0 4px rgba(0,0,0,.7)}
.shead .avatar{width:32px;height:32px;border:0}
.shead small{opacity:.8}
.shead .grow{flex:1}
.shead .ic{width:30px;height:30px;font-size:18px}
.shead .ic svg{width:22px;height:22px}
.szone{position:absolute;top:80px;bottom:0;z-index:2}
.szone.l{left:0;width:30%}
.szone.r{right:0;width:70%}

<script>
'use strict';
const APP_VERSION = '2.3 · 20.10.2026';   // збільшуй при кожному оновленні, щоб було видно, що телефон отримав нову версію

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('s'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('s'), 2200); }

/* ---------- storage (IndexedDB: стани акаунтів + фото/відео) ---------- */
let dbp;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ig-editor', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq && rq.result);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const kvGet = k => idb('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => idb('kv', 'readwrite', s => s.put(v, k));
const kvDel = k => idb('kv', 'readwrite', s => s.delete(k));
const imgPut = (id, b) => idb('img', 'readwrite', s => s.put(b, id));
const imgGet = id => idb('img', 'readonly', s => s.get(id));
const imgDel = id => idb('img', 'readwrite', s => s.delete(id));
const imgKeys = () => idb('img', 'readonly', s => s.getAllKeys());

/* ---------- state ---------- */
const blank = () => ({
  profile: { username: 'your_username', name: 'Твоє ім’я', category: '', bio: 'Напиши тут біо ✨\nДруга строчка', link: '', avatar: null, followers: '0', following: '0', verified: false, story: false, pro: false, views: '' },
  highlights: [],   // {id, title, cover, stories:[story]}
  posts: [],        // {id, imgs:[imgId], vids:{imgId:vidId}, caption, done, pinned, reel, views, likes, likedBy, comments, place, date}
  tagged: [],       // як posts, плюс owner
  my: { stories: [] },  // мої сторіз; story = {id, img, vid, text, t}
  archive: [],          // архівовані дописи (не видно в профілі), як posts + fromIdx
  pf: {}                // стан обкладинок відео: imgId -> 'ok' | 'bad'
});
let ACC = { active: null, list: [] };
let S = blank();
const urls = {};                 // id -> objectURL
let reorder = false, ptab = 'grid', saveT;
let selMode = false; const sel = new Set();

const stateKey = id => 'state:' + id;
async function loadState(id) { return Object.assign(blank(), (await kvGet(stateKey(id))) || {}); }
function normalize() { S.posts = [...S.posts.filter(p => p.pinned), ...S.posts.filter(p => !p.pinned)]; }   // закріплені — зверху
function save() {
  normalize(); clearTimeout(saveT);
  const id = ACC.active, st = S;
  saveT = setTimeout(() => kvSet(stateKey(id), st).catch(() => toast('Не вдалося зберегти 😕')), 250);
}
async function flushSave() { clearTimeout(saveT); normalize(); if (ACC.active) await kvSet(stateKey(ACC.active), S); }

function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(iso) {
  const d = new Date((iso || '') + 'T12:00:00'); if (!iso || isNaN(d)) return '';
  const o = { day: 'numeric', month: 'long' }; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('uk-UA', o).toUpperCase();
}
function ago(t) {
  if (!t) return '';
  const m = Math.max(1, Math.round((Date.now() - t) / 60000)); if (m < 60) return m + ' хв';
  const h = Math.round(m / 60); return h < 24 ? h + ' год' : Math.round(h / 24) + ' дн';
}
const RE_TAG = /(^|[^\p{L}\p{N}_])([#@][\p{L}\p{N}_.]*[\p{L}\p{N}_])/gu;
function rich(text) {   // екранування + хештеги/згадки синім
  text = String(text ?? ''); let out = '', last = 0;
  for (const m of text.matchAll(RE_TAG)) { const st = m.index + m[1].length; out += esc(text.slice(last, st)) + `<span class="tag">${esc(m[2])}</span>`; last = st + m[2].length; }
  return out + esc(text.slice(last));
}
const hue = s => [...String(s || '?')].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;

/* які id фото/відео використовує стан */
function idsOf(st) {
  const s = new Set(), add = i => i && s.add(i);
  add(st.profile.avatar);
  const stories = set => (set.stories || []).forEach(x => { add(x.img); add(x.vid); });
  (st.highlights || []).forEach(h => { add(h.cover); stories(h); });
  stories(st.my || {});
  [...(st.posts || []), ...(st.tagged || []), ...(st.archive || [])].forEach(p => { (p.imgs || []).forEach(add); Object.values(p.vids || {}).forEach(add); });
  return s;
}

async function addImg(blob) {
  const id = uid();
  await imgPut(id, blob);
  urls[id] = URL.createObjectURL(blob);
  return id;
}
async function dropImg(id) {
  if (!id) return;
  if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; }
  await imgDel(id).catch(() => {});
}
async function dropSlide(p, im) { await dropImg(im); if (p.vids && p.vids[im]) { await dropImg(p.vids[im]); delete p.vids[im]; } }
async function dropPostMedia(p) { for (const im of [...p.imgs]) await dropSlide(p, im); }
async function dropSet(set) { for (const s of set.stories || []) { await dropImg(s.img); await dropImg(s.vid); } }
function resetUrls() { for (const id of Object.keys(urls)) { URL.revokeObjectURL(urls[id]); delete urls[id]; } }
async function loadUrls(st) { for (const id of idsOf(st)) { const b = await imgGet(id); if (b) urls[id] = URL.createObjectURL(b); } }

/* ---------- media processing ---------- */
function fileToBlob(file, max, square = false, q = .88) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const w = im.naturalWidth, h = im.naturalHeight;
      let sx = 0, sy = 0, sw = w, sh = h;
      if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; }
      const k = Math.min(1, max / Math.max(sw, sh));
      const c = document.createElement('canvas');
      c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(new Error('encode')); }, 'image/jpeg', q);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('load')); };
    im.src = u;
  });
}
const waitEv = (el, ev, ms) => new Promise(res => {
  let t; const f = () => { clearTimeout(t); el.removeEventListener(ev, f); res(true); };
  t = setTimeout(() => { el.removeEventListener(ev, f); res(false); }, ms);
  el.addEventListener(ev, f);
});
const waitFrame = v => new Promise(res => {
  const t = setTimeout(res, v.requestVideoFrameCallback ? 600 : 250);
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => { clearTimeout(t); setTimeout(res, 30); });
});
function frameBlank(c) {   // чорний/порожній кадр? (iOS віддає такий, поки кадр не декодовано)
  try {
    const g = c.getContext('2d'); let sum = 0, sq = 0, n = 0;
    for (let i = 1; i < 8; i++) for (let j = 1; j < 8; j++) {
      const d = g.getImageData(Math.floor(c.width * i / 8), Math.floor(c.height * j / 8), 1, 1).data, l = (d[0] + d[1] + d[2]) / 3;
      sum += l; sq += l * l; n++;
    }
    const m = sum / n; return m < 4 && (sq / n - m * m) < 4;
  } catch { return false; }
}
async function videoPoster(file) {   // -> {blob, ok}: кадр із відео для обкладинки
  const u = URL.createObjectURL(file), v = document.createElement('video');
  v.muted = true; v.defaultMuted = true; v.playsInline = true; v.preload = 'auto';
  v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
  v.style.cssText = 'position:fixed;left:0;top:0;width:64px;height:64px;opacity:.01;pointer-events:none;z-index:-1';
  document.body.appendChild(v);   // у DOM, інакше Safari не декодує кадри
  const grab = () => {
    const w = v.videoWidth, h = v.videoHeight; if (!w || !h) return null;
    const k = Math.min(1, 1080 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    return c;
  };
  let out = null;
  try {
    v.src = u; v.load();
    if (v.readyState < 1) await waitEv(v, 'loadedmetadata', 6000);
    const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 1;
    for (const t of [Math.min(.1, dur / 2), Math.min(.6, dur / 2), dur / 2]) {   // кілька спроб: перший кадр буває чорним
      const sk = waitEv(v, 'seeked', 2500); v.currentTime = t; await sk; await waitFrame(v);
      const c = grab(); if (c && !frameBlank(c)) { out = c; break; }
    }
    if (!out) {   // запасний спосіб: програти без звуку й зловити кадр
      try { await v.play(); } catch {}
      await waitEv(v, 'timeupdate', 2500); await waitFrame(v);
      const c = grab(); if (c && !frameBlank(c)) out = c;
      v.pause();
    }
  } catch {}
  v.pause(); v.removeAttribute('src'); v.load(); v.remove(); URL.revokeObjectURL(u);
  if (out) { const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', .85)); if (blob) return { blob, ok: true }; }
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const g = c.getContext('2d'); g.fillStyle = '#222'; g.fillRect(0, 0, 540, 960);
  return { blob: await new Promise(r => c.toBlob(r, 'image/jpeg', .8)), ok: false };
}
const isVideo = f => (f.type || '').startsWith('video/') || /\.(mov|mp4|m4v|webm)$/i.test(f.name || '');
async function fileToMedia(file, max = 1440) {   // -> {img, vid|null}
  if (isVideo(file)) {
    if (file.size > 500e6) throw new Error('big');
    const r = await videoPoster(file);
    const img = await addImg(r.blob);
    const vid = await addImg(file);
    S.pf = S.pf || {}; S.pf[img] = r.ok ? 'ok' : 'bad';
    return { img, vid };
  }
  return { img: await addImg(await fileToBlob(file, max)), vid: null };
}
function pickFiles(input, accept) {
  return new Promise(res => {
    input.value = ''; if (accept) input.accept = accept;
    input.onchange = () => res([...input.files]);
    input.click();
  });
}
const pickMedia = accept => pickFiles($('#fileMedia'), accept);

/* ---------- обрізання фото ---------- */
let CR = null, cropRatio = '3:4';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const RATIOS = { '3:4': 3 / 4, '4:5': 4 / 5, '1:1': 1 };
// Показує екран обрізання. Повертає {blob} | 'skip' | 'skipAll' | null (скасовано)
function cropImage(src, o = {}) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(src), img = $('#cimg');
    img.onload = () => {
      CR = { url, resolve, iw: img.naturalWidth, ih: img.naturalHeight, zoom: 1, tx: 0, ty: 0, ptrs: new Map(), o };
      $('#ctitle').textContent = o.n > 1 ? `Обрізати ${o.i} з ${o.n}` : 'Обрізати';
      $('#cok').textContent = (o.n > 1 && o.i < o.n) ? 'Далі' : 'Готово';
      $('#crow').classList.toggle('hide', !o.canSkip);
      $('#cskipall').classList.toggle('hide', !(o.n > 1 && o.i < o.n));
      $('#czoom').value = 1;
      $('#cropper').classList.remove('hide'); syncLock();
      setRatio(cropRatio);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve('skip'); };   // не вдалось відкрити: додамо як є
    img.src = url;
  });
}
function setRatio(r) {
  if (!CR) return;
  cropRatio = r;
  document.querySelectorAll('#cratios [data-r]').forEach(b => b.classList.toggle('on', b.dataset.r === r));
  const st = $('#cstage').getBoundingClientRect(); CR.W = st.width; CR.H = st.height;
  const A = r === 'orig' ? CR.iw / CR.ih : RATIOS[r], pad = 24;
  let fw, fh;
  if ((CR.W - pad * 2) / (CR.H - pad * 2) > A) { fh = CR.H - pad * 2; fw = fh * A; } else { fw = CR.W - pad * 2; fh = fw / A; }
  CR.fw = fw; CR.fh = fh; CR.minS = Math.max(fw / CR.iw, fh / CR.ih);
  const f = $('#cframe'); f.style.width = fw + 'px'; f.style.height = fh + 'px'; f.style.left = (CR.W - fw) / 2 + 'px'; f.style.top = (CR.H - fh) / 2 + 'px';
  cropRender();
}
function cropRender() {
  const c = CR, s = c.minS * c.zoom, img = $('#cimg');
  const mx = Math.max(0, (c.iw * s - c.fw) / 2), my = Math.max(0, (c.ih * s - c.fh) / 2);
  c.tx = clamp(c.tx, -mx, mx); c.ty = clamp(c.ty, -my, my); c.s = s;
  img.style.width = c.iw * s + 'px'; img.style.height = c.ih * s + 'px';
  img.style.left = (c.W / 2 + c.tx - c.iw * s / 2) + 'px'; img.style.top = (c.H / 2 + c.ty - c.ih * s / 2) + 'px';

}

    if (e.type === 'pointerup' && quick && z) { z === 'l' ? prevStory() : nextStory(); return; }
    if (SV.v) SV.v.play().catch(() => {});
  };
  sv.addEventListener('pointerup', rel); sv.addEventListener('pointercancel', rel);
})();

/* ---------- posts ---------- */
function newPost(extra) {
  return Object.assign({ id: uid(), imgs: [], vids: {}, caption: '', done: false, pinned: false, reel: false, views: '', likes: '', likedBy: '', comments: '', place: '', date: today() }, extra);
}
async function addMedia() {
  if (ptab === 'tagged') {
    const files = await pickMedia('image/*'); if (!files.length) return;
    const ctx = cropCtx(files); const added = [];
    for (const f of files) { try { const m = await mediaWithCrop(f, ctx); if (!m) break; const p = newPost({ imgs: [m.img], owner: 'username' }); S.tagged.unshift(p); added.push(p); } catch {} }
    if (added.length) toast('Додаю фото…');
    save(); renderAll();
    if (added.length === 1) openPost(added[0].id); else toast(added.length ? `Додано: ${added.length}. Відкрий кожне, щоб вказати автора` : 'Не вдалося відкрити фото');
    return;
  }
  const reelsOnly = ptab === 'reels';
  const files = await pickMedia(reelsOnly ? 'video/*' : 'image/*,video/*'); if (!files.length) return;
  const ctx = cropCtx(files); let ok = 0, big = 0, cancelled = false;
  for (const f of files) {
    try {
      if (reelsOnly && !isVideo(f)) continue;
      const m = await mediaWithCrop(f, ctx);
      if (!m) { cancelled = true; break; }
      S.posts.unshift(newPost({ imgs: [m.img], vids: m.vid ? { [m.img]: m.vid } : {}, reel: !!m.vid }));   // новий допис — зверху, як в Instagram
      ok++;
    } catch (e) { if (e.message === 'big') big++; }
  }
  normalize(); save(); renderAll();
  toast(big ? 'Відео більше 500 МБ не додаю' : ok ? `Додано: ${ok}${cancelled ? ' (решту скасовано)' : ''}` : cancelled ? 'Скасовано' : 'Не вдалося відкрити файл');
}
function findPost(id) {
  let p = S.posts.find(x => x.id === id); if (p) return { p, kind: 'post' };
  p = S.tagged.find(x => x.id === id); if (p) return { p, kind: 'tagged' };
  p = S.archive.find(x => x.id === id); return p ? { p, kind: 'archive' } : null;
}
function openPost(id) {
  const f = findPost(id); if (!f) return;
  const { p, kind } = f, tagged = kind === 'tagged', archived = kind === 'archive', plain = kind === 'post';
  const list = tagged ? S.tagged : archived ? S.archive : S.posts, i = list.indexOf(p);
  const wasOpen = sheetOpen() && $('#sheet')._post;
  const html = `
    <div class="slides ${p.imgs.length === 1 ? 'one' : ''}">${p.imgs.map(im => `<div class="slide">${mediaThumb(im, p.vids && p.vids[im])}${p.vids && p.vids[im] ? '<span class="play">▶ відео</span>' : `<button class="cr" data-act="cropSlide" data-img="${im}" aria-label="Обрізати">✂</button>`}${p.imgs.length > 1 ? `<button class="x" data-act="rmSlide" data-img="${im}">×</button>` : ''}</div>`).join('')}</div>
    ${archived ? '<p class="hint">Цей допис в архіві: його не видно в профілі.</p><button class="btn primary" data-act="restorePost" style="width:100%;margin-bottom:8px">↩ Повернути в профіль</button>' : ''}
    ${plain ? `<div class="pos"><button class="btn" data-act="mv" data-d="-1" ${i === 0 ? 'disabled style="opacity:.4"' : ''}>← раніше</button><span>позиція ${i + 1} з ${list.length}</span><button class="btn" data-act="mv" data-d="1" ${i === list.length - 1 ? 'disabled style="opacity:.4"' : ''}>пізніше →</button></div>` : ''}
    ${tagged ? `<label class="f"><small>Хто опублікував (нік)</small><input data-pk="owner" value="${esc(p.owner || '')}"></label>` : ''}
    <label class="f"><small>Підпис <span class="cnt" id="capCnt"></span></small><textarea id="cap" style="min-height:120px">${esc(p.caption)}</textarea></label>
    <label class="f"><small>Місце (геотег)</small><input data-pk="place" value="${esc(p.place || '')}"></label>
    <div style="display:flex;gap:10px"><label class="f" style="flex:1"><small>Вподобання</small><input data-pk="likes" value="${esc(p.likes || '')}"></label><label class="f" style="flex:1"><small>Коментарі</small><input data-pk="comments" value="${esc(p.comments || '')}"></label></div>
    <label class="f"><small>Хто вподобав (нік) — рядок «Вподобали X та ще N»</small><input data-pk="likedBy" value="${esc(p.likedBy || '')}"></label>
    <label class="f"><small>Дата</small><input type="date" data-pk="date" value="${esc(p.date || '')}"></label>
    ${tagged ? '' : `<label class="f chk"><input type="checkbox" data-pk="reel" ${p.reel ? 'checked' : ''}> Це Reel (показувати у вкладці Reels)</label>
    <label class="f"><small>Перегляди Reel (напр. 12,5 тис.)</small><input data-pk="views" value="${esc(p.views || '')}"></label>`}
    ${plain ? `<label class="f chk"><input type="checkbox" data-pk="pinned" ${p.pinned ? 'checked' : ''}> Закріпити в профілі (до 3)</label>` : ''}
    <div style="display:flex;gap:6px;margin-top:6px"><button class="btn" data-act="addSlide">＋ Ще фото/відео (карусель)</button></div>
    <div style="display:flex;gap:6px;margin-top:6px">${plain ? '<button class="btn" data-act="archivePost">📦 В архів</button>' : ''}<button class="btn danger" data-act="delPost">Видалити назовсім</button></div>`;
  if (wasOpen) { const keep = $('.sheet').scrollTop; $('#sheet').innerHTML = `<div class="sheet"><div class="bar"><b>Допис</b><button data-act="closeSheet">Готово</button></div>${html}</div>`; $('.sheet').scrollTop = keep; }
  else openSheet('Допис', html);
  const sh = $('#sheet'); sh._post = p;
  const cnt = () => { const c = $('#capCnt'); if (c) c.textContent = [...p.caption].length + '/2200'; };
  cnt();
  sh.oninput = e => {
    const t = e.target;
    if (t.id === 'cap') { p.caption = t.value; cnt(); save(); return; }
    const k = t.dataset.pk; if (!k) return;
    if (k === 'pinned') {
      if (t.checked && S.posts.filter(x => x.pinned).length >= 3) { t.checked = false; toast('Максимум 3 закріплені'); return; }
      p.pinned = t.checked; normalize(); save(); renderGrid(); openPost(p.id); return;
    }
    if (k === 'reel') { p.reel = t.checked; save(); renderGrid(); return; }
    p[k] = t.value; save();
  };
}
function movePost(d) {
  const p = $('#sheet')._post, i = S.posts.indexOf(p), j = i + d;
  if (i < 0 || j < 0 || j >= S.posts.length) return;
  S.posts.splice(i, 1); S.posts.splice(j, 0, p); normalize();
  save(); renderGrid(); openPost(p.id);
}
async function addSlide() {
  const p = $('#sheet')._post; if (!p) return;
  const files = await pickMedia('image/*,video/*'); const ctx = cropCtx(files);
  for (const f of files) {
    if (p.imgs.length >= 20) { toast('Максимум 20 у каруселі'); break; }
    try { const m = await mediaWithCrop(f, ctx); if (!m) break; p.imgs.push(m.img); if (m.vid) (p.vids = p.vids || {})[m.img] = m.vid; } catch {}
  }
  save(); renderGrid(); openPost(p.id);
}
async function cropSlide(img) {   // повторне обрізання вже доданого фото
  const p = $('#sheet')._post; if (!p) return;
  const blob = await imgGet(img); if (!blob) return;
  const r = await cropImage(blob, { i: 1, n: 1, canSkip: false });
  if (!r || !r.blob) return;
  const nid = await addImg(r.blob), idx = p.imgs.indexOf(img);
  p.imgs[idx] = nid; await dropImg(img);
  save(); renderAll(); openPost(p.id); toast('Обрізано ✓');
}
async function rmSlide(img) {

async function delPost() {

/* ---------- архів ---------- */
function toArchive(posts) {   // прибирає дописи з профілю в архів, нічого не видаляючи
  const keep = new Set(posts);
  posts.forEach(p => { p.fromIdx = S.posts.indexOf(p); p.pinned = false; });
  S.posts = S.posts.filter(p => !keep.has(p));
  S.archive.unshift(...posts);
}
function archivePost() {
  const p = $('#sheet')._post; if (!p || !S.posts.includes(p)) return;
  toArchive([p]); save();
  closeSheet(); toast('Перенесено в архів 📦');
}
function restorePost() {
  const p = $('#sheet')._post; if (!p || !S.archive.includes(p)) return;
  S.archive = S.archive.filter(x => x !== p);
  S.posts.splice(Math.min(p.fromIdx || 0, S.posts.length), 0, p); delete p.fromIdx;
  normalize(); save(); closeSheet(); toast('Повернено в профіль ✓');
}
function toggleSel() {

}

  const picked = S.posts.filter(p => sel.has(p.id)), n = picked.length;
  toArchive(picked); selMode = false; sel.clear(); save(); renderAll();
  toast(`В архів: ${n} 📦`);

    : '<div class="empty"><b>Архів порожній</b>Щоб прибрати допис з профілю, не видаляючи його, відкрий допис → «⋯» → «В архів», або натисни «☑ Вибрати» в смужці «Редактор».</div>';

/* ---------- reorder (drag & drop у сітці) ---------- */
let drag = null;
function startDrag(e) {
  if (!reorder || ptab !== 'grid') return;
  const cell = e.target.closest('.cell'); if (!cell) return;
  e.preventDefault();
  const r = cell.getBoundingClientRect();
  const ghost = cell.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, { width: r.width + 'px', height: r.height + 'px', left: r.left + 'px', top: r.top + 'px' });
  document.body.appendChild(ghost);
  cell.classList.add('ph');
  drag = { cell, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, y: e.clientY };
  try { $('#grid').setPointerCapture(e.pointerId); } catch {}
}
function moveDrag(e) {
  if (!drag) return;
  e.preventDefault();
  drag.y = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const under = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList.contains('cell') && el !== drag.cell && !el.classList.contains('ghost'));
  if (under) {
    const grid = under.parentNode, cells = [...grid.children];
    const a = cells.indexOf(drag.cell), b = cells.indexOf(under);
    grid.insertBefore(drag.cell, a < b ? under.nextSibling : under);
  }
}
function endDrag() {
  if (!drag) return;
  const order = [...$('#grid .grid').children].map(c => c.dataset.id);
  const map = Object.fromEntries(S.posts.map(p => [p.id, p]));
  S.posts = order.map(id => map[id]); normalize();
  drag.ghost.remove(); drag.cell.classList.remove('ph'); drag = null;
  save(); renderGrid();
}
(function autoscroll() {
  if (drag) { const h = innerHeight; if (drag.y < 110) scrollBy(0, -10); else if (drag.y > h - 110) scrollBy(0, 10); }
  requestAnimationFrame(autoscroll);
})();

/* ---------- view: перенесення в Instagram ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch {
    const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = 0;
    document.body.appendChild(a); a.select(); a.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); } catch {} a.remove();
  }
  toast('Скопійовано ✓');
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
const extOf = b => ({ 'image/jpeg': 'jpg', 'image/png': 'png', 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm' }[b.type] || (b.type.split('/')[1] || 'bin'));
async function shareFiles(blobs, base) {
  if (!blobs.length) return toast('Немає що зберігати');
  const files = blobs.map((b, i) => new File([b], `${base}${blobs.length > 1 ? '-' + (i + 1) : ''}.${extOf(b)}`, { type: b.type || 'application/octet-stream' }));
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  files.forEach(f => download(f, f.name));
  toast('Збережено у файли');
}
async function shareAvatar() {
  const b = S.profile.avatar && await imgGet(S.profile.avatar);
  if (!b) return toast('Спочатку додай фото профілю');
  shareFiles([b], 'avatar');
}
async function sharePost(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return;
  const blobs = [];
  for (const im of p.imgs) { const b = await imgGet(p.vids && p.vids[im] ? p.vids[im] : im); if (b) blobs.push(b); }
  shareFiles(blobs, 'post-' + (S.posts.length - S.posts.indexOf(p)));
}
async function shareSet(key) {
  const set = key === 'my' ? S.my : S.highlights.find(h => h.id === key); if (!set) return;
  const blobs = []; for (const s of set.stories) { const b = await imgGet(s.vid || s.img); if (b) blobs.push(b); }
  shareFiles(blobs, key === 'my' ? 'story' : 'highlight');
}
function renderMove() {
  const p = S.profile;
  const order = S.posts.slice().reverse();     // публікуємо від найстарішого (внизу сітки) до найновішого (зверху)
  const left = order.filter(x => !x.done).length;
  const sets = [...(S.my.stories.length ? [{ k: 'my', t: 'Мої сторіз', n: S.my.stories.length }] : []),
    ...S.highlights.filter(h => (h.stories || []).length).map(h => ({ k: h.id, t: 'Актуальне: ' + (h.title || 'без назви'), n: h.stories.length }))];
  $('#v-move').innerHTML = `
    <h2>1. Профіль</h2>
    <p class="hint">Скопіюй текст і встав у «Редагувати профіль» в Instagram.</p>
    <div class="card">
      ${[['Ім’я користувача', p.username], ['Ім’я', p.name], ['Біо', p.bio], ['Посилання', p.link]].map(([l, v], i) =>
        `<div class="field"><div><b>${l}</b><div class="v">${esc((v || '—').split('\n')[0])}</div></div><button class="btn" data-act="copyProf" data-i="${i}">Копіювати</button></div>`).join('')}
      <div class="field"><div><b>Фото профілю</b></div><button class="btn" data-act="shareAv">Зберегти / надіслати</button></div>
    </div>
    <h2>2. Дописи по порядку</h2>
    <p class="hint">Instagram показує найновіше зверху, тому викладати треба <b>знизу вгору</b>: спершу №1 (найнижчий у сітці), потім №2 і так далі — і сітка в реальному профілі стане такою ж, як тут.${order.length ? ` Залишилось: <b>${left}</b> з ${order.length}.` : ''}</p>
    ${order.length ? order.map((x, i) => `
      <div class="card step ${x.done ? 'done' : ''}">
        <div class="th">${mediaThumb(x.imgs[0], x.vids && x.vids[x.imgs[0]])}</div>
        <div class="tx">
          <div class="t">№${i + 1}${x.reel ? ' · Reel' : ''}${x.imgs.length > 1 ? ` · ${x.imgs.length} шт.` : ''}${x.pinned ? ' · 📌 потім закріпити' : ''}</div>
          <div class="cap">${esc(x.caption) || '<i>без підпису</i>'}</div>
          <div class="act">
            <button class="btn" data-act="copyCap" data-id="${x.id}">Підпис</button>
            <button class="btn" data-act="sharePost" data-id="${x.id}">Фото/відео</button>
            <button class="btn ${x.done ? 'on' : ''}" data-act="done" data-id="${x.id}">${x.done ? '✓ Опубліковано' : 'Опубліковано?'}</button>
          </div>
        </div>
      </div>`).join('') : '<div class="card empty">Поки немає дописів.</div>'}
    <h2>3. Сторіз і актуальне</h2>
    <p class="hint">Збережи файли й виклади в Instagram як сторіз. Актуальне збирай зі своїх сторіз у профілі. Текст на сторіз додається вже в Instagram.</p>
    ${sets.length ? `<div class="card">${sets.map(s => `<div class="field"><div><b>${esc(s.t)}</b><div class="v">${s.n} шт.</div></div><button class="btn" data-act="shareSet" data-k="${s.k}">Зберегти</button></div>`).join('')}</div>` : '<div class="card empty">Сторіз ще немає.</div>'}
    <h2>4. Резервна копія</h2>
    <p class="hint">Усе зберігається тільки в цьому телефоні. Зберігай копію (наприклад, у «Файли» чи iCloud) — її можна відновити на новому телефоні. У копію входять усі акаунти, фото й обкладинки відео, <b>самі відео не входять</b> (вони завеликі) — їх збережи окремо через «Фото/відео» вище.</p>
    <div class="btns"><button class="btn" data-act="backup">Зберегти копію</button><button class="btn" data-act="restore">Відновити з копії</button></div>
    <p class="hint" style="text-align:center;margin-top:28px">Версія програми: <b>${APP_VERSION}</b></p>
    <div class="btns"><button class="btn" data-act="forceUpdate">Перевірити оновлення</button></div>
    <p class="hint" style="text-align:center">Ваші фото й дані при цьому не зачіпаються.</p>`;
}
async function forceUpdate() {   // скидає кеш програми й перезавантажує свіжу версію (дані в IndexedDB не чіпає)
  toast('Оновлюю…');
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch {}
  location.replace(location.pathname + '?u=' + Date.now());
}

function blobToDataURL(b) { return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); }
function stripVideos(st) {
  const c = JSON.parse(JSON.stringify(st));
  [...c.posts, ...c.tagged, ...(c.archive || [])].forEach(p => { delete p.vids; });
  [...c.highlights, c.my].forEach(set => (set.stories || []).forEach(s => { s.vid = null; }));
  return c;
}
async function backup() {
  toast('Готую копію…');
  await flushSave();
  const accounts = {}, images = {};
  for (const id of ACC.list) {
    const clean = stripVideos(id === ACC.active ? S : await loadState(id));
    accounts[id] = clean;
    for (const i of idsOf(clean)) if (!(i in images)) { const b = await imgGet(i); if (b) images[i] = await blobToDataURL(b); }
  }
  const blob = new Blob([JSON.stringify({ app: 'ig-editor', v: 2, active: ACC.active, accounts, images })], { type: 'application/json' });
  const file = new File([blob], `instagram-maket-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  download(file, file.name);
}
async function restore() {
  const [f] = await pickFiles($('#fileBackup'), 'application/json,.json'); if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'ig-editor' || !(d.accounts || d.state)) throw 0;
    if (!confirm(d.accounts ? 'Замінити ВСІ поточні акаунти копією з файлу?' : 'Додати акаунт із файлу?')) return;
    await flushSave();
    const put = async images => { for (const [id, data] of Object.entries(images || {})) await imgPut(id, await (await fetch(data)).blob()); };
    if (d.accounts) {
      for (const id of ACC.list) { for (const i of idsOf(id === ACC.active ? S : await loadState(id))) await dropImg(i); await kvDel(stateKey(id)); }
      await put(d.images);
      for (const [id, st] of Object.entries(d.accounts)) await kvSet(stateKey(id), Object.assign(blank(), st));
      ACC = { active: d.accounts[d.active] ? d.active : Object.keys(d.accounts)[0], list: Object.keys(d.accounts) };
    } else {
      await put(d.images);
      const id = uid(); await kvSet(stateKey(id), Object.assign(blank(), d.state)); ACC.list.push(id); ACC.active = id;
    }
    await kvSet('accounts', ACC);
    closeAllOverlays();
    S = await loadState(ACC.active); resetUrls(); await loadUrls(S); ptab = 'grid';
    renderAll(); toast('Відновлено ✓'); fixPosters();
  } catch { toast('Це не схоже на файл копії'); }
}

/* ---------- events ---------- */
function setTab(t) {
  $('#v-feed').classList.toggle('hide', t !== 'feed');
  $('#v-move').classList.toggle('hide', t !== 'move');
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('a', b.dataset.tab === t));
  if (t === 'move') renderMove();
  scrollTo(0, 0);
}
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  const cell = e.target.closest('.cell');
  if (cell && cell.closest('#archive')) return openPost(cell.dataset.id);
  if (cell && selMode && !cell.classList.contains('ghost')) {
    const cid = cell.dataset.id; sel.has(cid) ? sel.delete(cid) : sel.add(cid); return renderGrid();
  }
  if (cell && !reorder && !cell.classList.contains('ghost')) {
    if (ptab === 'reels') return openReels(cell.dataset.id);
    return openViewer(cell.dataset.id, ptab === 'tagged' ? 'tagged' : 'posts');
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, id = d.id;
  switch (d.act) {
    case 'tab': setTab(d.tab); break;
    case 'ptab': ptab = d.p; reorder = false; selMode = false; sel.clear(); renderGrid(); break;
    case 'editProfile': editProfile(); break;
    case 'addMedia': addMedia(); break;
    case 'toggleReorder':
      if (ptab !== 'grid') { toast('Порядок змінюється у вкладці сітки'); break; }
      reorder = !reorder; if (reorder) { selMode = false; sel.clear(); } renderGrid(); if (reorder) toast('Тримай фото й перетягуй'); break;
    case 'toggleClean': { const on = document.body.classList.toggle('clean'); if (on && (reorder || selMode)) { reorder = false; selMode = false; sel.clear(); renderGrid(); } break; }
    case 'menu': openMenu(); break;
    case 'cropOk': cropOk(); break;
    case 'cropCancel': cropEnd(null); break;
    case 'cropSkip': cropEnd('skip'); break;
    case 'cropSkipAll': cropEnd('skipAll'); break;
    case 'cropRatio': setRatio(d.r); break;
    case 'cropSlide': cropSlide(d.img); break;
    case 'openArchive': closeSheet(); openArchive(); break;
    case 'closeArchive': closeArchive(); break;
    case 'archivePost': archivePost(); break;
    case 'restorePost': restorePost(); break;
    case 'toggleSel': toggleSel(); break;
    case 'cancelSel': cancelSel(); break;
    case 'archiveSel': archiveSel(); break;
    case 'closeSheet': closeSheet(); break;
    case 'closeViewer': closeViewer(); break;
    case 'closeReels': closeReels(); break;
    case 'closeStories': closeStories(); break;
    case 'editStoriesBtn': { const ed = SV && SV.edit; closeStories(); if (ed) ed(); break; }
    case 'editPost': openPost(id); break;
    case 'editMy': editMyStories(); break;
    case 'pickAvatar': pickAvatar(); break;
    case 'hlTap': hlTap(id); break;
    case 'avatarTap': avatarTap(); break;
    case 'pickCover': pickCover(); break;
    case 'delHl': delHl(); break;
    case 'addStories': addStories(); break;
    case 'rmStory': rmStory(d.sid); break;
    case 'accounts': openAccounts(); break;
    case 'switchAcc': if (id === ACC.active) closeSheet(); else switchTo(id).then(closeSheet); break;
    case 'addAcc': closeSheet(); newAccount().then(editProfile); break;
    case 'delAcc': removeAccount(id); break;
    case 'mv': movePost(+d.d); break;
    case 'addSlide': addSlide(); break;
    case 'rmSlide': rmSlide(d.img); break;
    case 'delPost': delPost(); break;
    case 'like': el.classList.toggle('lk-on'); break;
    case 'saveMark': el.classList.toggle('sv-on'); break;
    case 'toggleMute': { const v = el.querySelector('video'), m = el.querySelector('.mute'); if (v) { v.muted = !v.muted; if (m) m.textContent = v.muted ? '🔇' : '🔊'; if (!v.muted) v.play().catch(() => {}); } break; }
    case 'rtap': { const v = el.querySelector('video'); if (v) { v.paused ? v.play().catch(() => {}) : v.pause(); } break; }
    case 'rmute': {
      rMuted = !rMuted; $('#rmuteBtn').textContent = rMuted ? '🔇' : '🔊';
      document.querySelectorAll('#rlist video').forEach(v => { v.muted = rMuted; });
      const rl = $('#rlist'), cur = [...rl.children].find(s => Math.abs(s.getBoundingClientRect().top) < 5);
      const v = cur && cur.querySelector('video'); if (v) v.play().catch(() => {});
      break;
    }
    case 'more': { const fc = el.closest('.fc'); fc.querySelector('.short').classList.add('hide'); el.classList.add('hide'); fc.querySelector('.full').classList.remove('hide'); break; }
    case 'fake': toast('Це лише макет 🙂'); break;
    case 'copyProf': copyText([S.profile.username, S.profile.name, S.profile.bio, S.profile.link][+d.i] || ''); break;
    case 'shareAv': shareAvatar(); break;
    case 'copyCap': copyText((S.posts.find(x => x.id === id) || {}).caption || ''); break;
    case 'sharePost': sharePost(id); break;
    case 'shareSet': shareSet(d.k); break;
    case 'done': { const p = S.posts.find(x => x.id === id); p.done = !p.done; save(); renderMove(); break; }
    case 'forceUpdate': forceUpdate(); break;
    case 'backup': backup(); break;
    case 'restore': restore(); break;
  }
});
const gridEl = $('#grid');
gridEl.addEventListener('pointerdown', startDrag);
gridEl.addEventListener('pointermove', moveDrag);
gridEl.addEventListener('pointerup', endDrag);
gridEl.addEventListener('pointercancel', endDrag);

/* ---------- init ---------- */
(async function init() {
  try {
    let acc = await kvGet('accounts');
    if (!acc) {   // перший запуск або міграція зі старого формату (один акаунт)
      const old = await kvGet('state'), id = uid();
      acc = { active: id, list: [id] };
      await kvSet(stateKey(id), Object.assign(blank(), old || {}));
      await kvSet('accounts', acc);
      if (old) await kvDel('state');
    }
    ACC = acc;
    if (!ACC.list.includes(ACC.active)) ACC.active = ACC.list[0];
    S = await loadState(ACC.active);
    await loadUrls(S);
    // прибрати «осиротілі» файли (використані жодним акаунтом)
    const used = new Set();
    for (const id of ACC.list) idsOf(id === ACC.active ? S : await loadState(id)).forEach(i => used.add(i));
    for (const k of await imgKeys()) if (!used.has(k)) await imgDel(k);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    toast('Сховище недоступне (приватний режим?)');
  }
  renderAll(); fixPosters();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
