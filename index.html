<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Макет Insta">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Макет профілю</title>
<style>
:root{
  --bg:#fff;--fg:#111;--muted:#737373;--line:#dbdbdb;--soft:#efefef;--accent:#0095f6;--danger:#ed4956;--card:#fff;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--fg:#f5f5f5;--muted:#a8a8a8;--line:#262626;--soft:#262626;--card:#121212}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(64px + var(--safe-b));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--fg)}
.wrap{max-width:560px;margin:0 auto}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700;border-bottom:1px solid var(--line)}
.top .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .ico{width:26px;height:26px}

/* profile */
.prof{padding:14px 16px 0}
.row1{display:flex;align-items:center;gap:22px}
.avatar{width:86px;height:86px;border-radius:50%;background:var(--soft) center/cover;flex:none;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}
.stats span{font-size:13px}
.name{font-weight:600;margin-top:12px}
.cat{color:var(--muted);font-size:14px}
.bio{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.link{color:#00376b;font-weight:600;word-break:break-all}
@media (prefers-color-scheme:dark){.link{color:#e0f1ff}}
.btns{display:flex;gap:6px;margin:14px 0}
.btn{flex:1;background:var(--soft);border-radius:8px;padding:8px 6px;font-weight:600;text-align:center;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.on{background:var(--fg);color:var(--bg)}
.btn.danger{color:var(--danger)}
.hl{display:flex;gap:14px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hl button{flex:none;width:68px;text-align:center;font-size:12px}
.hl .c{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);margin:0 auto 4px;background:var(--soft) center/cover;display:grid;place-items:center;font-size:28px;color:var(--muted);padding:3px;background-clip:content-box}
.hl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs div{flex:1;display:grid;place-items:center;padding:10px 0;color:var(--muted)}
.tabs div.a{color:var(--fg);box-shadow:inset 0 -1px 0 var(--fg)}
.tabs svg{width:24px;height:24px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{position:relative;aspect-ratio:3/4;background:var(--soft) center/cover;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cell .car{position:absolute;top:6px;right:6px;width:20px;height:20px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.cell .num{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
.cell.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:scale(1.06)}
.cell.ph{opacity:.25}
.reorder .cell{touch-action:none}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
.nav button{flex:1;padding:10px 0 8px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted)}
.nav button.a{color:var(--fg);font-weight:600}
.nav svg{width:26px;height:26px}

/* transfer view */
.pad{padding:16px}
h2{font-size:18px;margin:22px 0 6px}
h2:first-child{margin-top:0}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.step{display:flex;gap:10px;align-items:flex-start}
.step .th{width:60px;aspect-ratio:3/4;border-radius:6px;background:var(--soft) center/cover;flex:none;position:relative}
.step .tx{flex:1;min-width:0}
.step .tx .cap{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.step .tx .t{font-weight:600}
.step .act{display:flex;gap:6px;flex-wrap:wrap}
.step .act .btn{flex:none;padding:6px 10px;font-size:13px}
.step.done{opacity:.5}
.field{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border:0}
.field .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.field .btn{flex:none;padding:6px 12px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet .bar b{font-size:17px}
.sheet .bar button{color:var(--accent);font-weight:600}
label.f{display:block;margin:10px 0}
label.f small{display:block;color:var(--muted);margin-bottom:3px}
label.f input,label.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px}
label.f textarea{min-height:92px;resize:vertical}
.cnt{float:right}
.pic{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.pic .avatar{width:64px;height:64px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-bottom:6px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:72%;scroll-snap-align:center;position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft)}
.slides.one .slide{width:100%}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:18px;display:grid;place-items:center}
.pos{display:flex;align-items:center;gap:8px;margin:8px 0}
.pos span{flex:1;text-align:center;color:var(--muted)}
.pos .btn{flex:none;width:96px}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#262626;color:#fff;padding:9px 16px;border-radius:20px;z-index:40;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.s{opacity:1}

/* instagram-like details */
:root{--tag:#00376b}
@media (prefers-color-scheme:dark){:root{--tag:#e0f1ff}}
.tag{color:var(--tag)}
.link{color:var(--tag)}
.top .un{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.top .un>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .chev{width:14px;height:14px;flex:none}
.top .ic{width:26px;height:26px;display:grid;place-items:center;margin-left:14px;flex:none}
.top .ic svg{width:26px;height:26px}
.badge{width:14px;height:14px;vertical-align:-1px;margin-left:4px;flex:none}
.editor{display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--soft);font-size:12px;color:var(--muted);overflow-x:auto;scrollbar-width:none}
.editor::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px dashed var(--muted);border-radius:16px;padding:4px 10px;font-size:13px;color:var(--fg);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-style:solid}
.avwrap{padding:3px;border-radius:50%;flex:none}
.avwrap .avatar{width:80px;height:80px}
.avwrap.ring,.avs.ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.avwrap.ring .avatar,.avs.ring .avatar{border:3px solid var(--bg)}
.lk{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.pro{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:12px;display:grid;gap:1px}
.pro span{font-size:13px}
.pro small{color:var(--muted);font-size:12px}
.btn.sq{flex:none;width:38px;padding:0;display:grid;place-items:center}
.btn.sq svg{width:18px;height:18px}
.cell .pin{position:absolute;top:6px;left:6px;width:18px;height:18px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
label.f.chk{display:flex;align-items:center;gap:10px}
label.f.chk input{width:auto;margin:0;transform:scale(1.25)}
body.clean .editor,body.clean .nav{display:none!important}
body.clean{padding-bottom:var(--safe-b)}
#exitClean{display:none;position:fixed;right:12px;bottom:calc(12px + var(--safe-b));width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;z-index:9;place-items:center;font-size:16px}
body.clean #exitClean{display:grid}

/* feed viewer */
#viewer{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#viewer .vwrap{max-width:560px;margin:0 auto;padding-bottom:calc(30px + var(--safe-b))}
.vtop{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(8px + var(--safe-t)) 12px 8px;border-bottom:1px solid var(--line)}
.vtop .ic{width:28px;height:28px;display:grid;place-items:center}
.vtop .ic svg{width:26px;height:26px}
.vtop div{flex:1;text-align:center;margin-right:40px;line-height:1.15}
.vtop small{display:block;color:var(--muted);font-size:12px}
.vtop b{font-size:16px}
.fp{scroll-margin-top:calc(56px + var(--safe-t));padding-bottom:14px}
.fh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.avs{padding:2px;border-radius:50%;flex:none}
.avs .avatar{width:32px;height:32px;border:0}
.avs.ring .avatar{border-width:2px}
.who{flex:1;min-width:0;line-height:1.2}
.who b{font-size:14px}
.who small{display:block;font-size:12px}
.ic{display:grid;place-items:center}
.fh .ic{width:28px;height:28px}
.fh .ic svg{width:22px;height:22px}
.fm{position:relative}
.fslides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.fslides::-webkit-scrollbar{display:none}
.fslide{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:4/5;background:var(--soft)}
.fslide img{width:100%;height:100%;object-fit:cover;display:block}
.pager{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);color:#fff;border-radius:12px;padding:2px 9px;font-size:12px}
.acts{display:flex;align-items:center;gap:14px;padding:10px 12px 6px;position:relative}
.acts .ic{width:26px;height:26px}
.acts .ic svg{width:26px;height:26px}
.acts .ic:last-child{margin-left:auto}
.acts .ic.lk-on svg{fill:#ed4956;stroke:#ed4956}
.acts .ic.sv-on svg{fill:currentColor}
.dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5}
.dots i.a{background:var(--accent);opacity:1}
.likes,.fc,.cm,.dt{padding:0 12px}
.likes{font-size:14px;margin-bottom:4px}
.fc{font-size:14px;white-space:pre-wrap;word-break:break-word}
.fc .more{color:var(--muted);font-size:14px}
.cm{color:var(--muted);font-size:14px;margin-top:4px}
.dt{color:var(--muted);font-size:11px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div id="v-feed">
    <div class="top">
      <span class="un"><span id="topname"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      <button class="ic" data-act="addPhotos" aria-label="Додати"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
      <button class="ic" data-act="fake" aria-label="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </div>
    <div class="editor" id="editor">
      <span>Редактор:</span>
      <button class="chip" data-act="addPhotos">＋ Фото</button>
      <button class="chip" data-act="toggleReorder" id="btnReorder">↕ Порядок</button>
      <button class="chip" data-act="toggleClean">👁 Чистий вигляд</button>
    </div>
    <div class="prof">
      <div class="row1">
        <div class="avwrap" id="avwrap"><div class="avatar" id="avatar"></div></div>
        <div class="stats">
          <div><b id="stPosts">0</b><span>дописи</span></div>
          <div><b id="stFol"></b><span>підписники</span></div>

      <div class="btns">
        <button class="btn" data-act="editProfile">Редагувати профіль</button>
        <button class="btn" data-act="fake">Поділитися профілем</button>
        <button class="btn sq" data-act="fake" aria-label="Додати друзів"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20a6.5 6.5 0 0 1 12-3M19 9v6M16 12h6"/></svg></button>
      </div>
      <div class="hl" id="hl"></div>
    </div>
    <div class="tabs">
      <div class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 8h18M9 3l3 5M15 3l3 5"/><path d="m10 12 5 3-5 3z" fill="currentColor"/></svg></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z" opacity="0"/><path d="M5 3h14a1 1 0 0 1 1 1v13l-3 3H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 17a5 5 0 0 1 9 0"/></svg></div>
    </div>
    <div id="grid"></div>
  </div>

  <div id="v-move" class="pad hide"></div>
</div>

<nav class="nav">
  <button data-act="tab" data-tab="feed" class="a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Макет</button>
  <button data-act="tab" data-tab="move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg>В Instagram</button>
</nav>

<div id="viewer" class="hide"><div class="vwrap">
  <div class="vtop"><button class="ic" data-act="closeViewer" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><div><small id="vuser"></small><b>Дописи</b></div></div>
  <div id="vlist"></div>
</div></div>
<button id="exitClean" data-act="toggleClean" aria-label="Вийти з чистого вигляду">✕</button>
<div id="sheet" class="hide"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="fileOne" accept="image/*" hidden>
<input type="file" id="fileBackup" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('s'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('s'), 2200); }

/* ---------- storage (IndexedDB: стан + фото) ---------- */
let dbp;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ig-editor', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq && rq.result);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const kvGet = k => idb('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => idb('kv', 'readwrite', s => s.put(v, k));
const imgPut = (id, b) => idb('img', 'readwrite', s => s.put(b, id));
const imgGet = id => idb('img', 'readonly', s => s.get(id));
const imgDel = id => idb('img', 'readwrite', s => s.delete(id));
const imgKeys = () => idb('img', 'readonly', s => s.getAllKeys());

/* ---------- state ---------- */
const blank = () => ({
  profile: { username: 'your_username', name: 'Твоє ім’я', category: '', bio: 'Напиши тут біо ✨\nДруга строчка', link: '', avatar: null, followers: '0', following: '0', verified: false, story: false, pro: false, views: '' },
  highlights: [],
  posts: []   // {id, imgs:[imgId], caption, done}
});
let S = blank();
const urls = {};            // imgId -> objectURL
let reorder = false;
let saveT;
function normalize() { S.posts = [...S.posts.filter(p => p.pinned), ...S.posts.filter(p => !p.pinned)]; }   // закріплені — завжди зверху
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(iso) {
  const d = new Date((iso || '') + 'T12:00:00'); if (!iso || isNaN(d)) return '';
  const o = { day: 'numeric', month: 'long' }; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('uk-UA', o).toUpperCase();
}
const RE_TAG = /(^|[^\p{L}\p{N}_])([#@][\p{L}\p{N}_.]*[\p{L}\p{N}_])/gu;
function rich(text) {   // екранування + хештеги/згадки синім
  text = String(text ?? ''); let out = '', last = 0;
  for (const m of text.matchAll(RE_TAG)) { const st = m.index + m[1].length; out += esc(text.slice(last, st)) + `<span class="tag">${esc(m[2])}</span>`; last = st + m[2].length; }
  return out + esc(text.slice(last));
}

/* ---------- image processing ---------- */
function fileToBlob(file, max, square = false, q = .88) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const w = im.naturalWidth, h = im.naturalHeight;
      let sx = 0, sy = 0, sw = w, sh = h;
      if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; }
      const k = Math.min(1, max / Math.max(sw, sh));
      const c = document.createElement('canvas');
      c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(new Error('encode')); }, 'image/jpeg', q);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('load')); };
    im.src = u;
  });
}
function pickFiles(input) {
  return new Promise(res => {
    input.value = '';
    input.onchange = () => res([...input.files]);
    input.click();
  });
}

/* ---------- reorder (drag & drop у сітці) ---------- */
let drag = null;
function startDrag(e) {
  if (!reorder) return;
  const cell = e.target.closest('.cell'); if (!cell) return;
  e.preventDefault();
  const r = cell.getBoundingClientRect();
  const ghost = cell.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, { width: r.width + 'px', height: r.height + 'px', left: r.left + 'px', top: r.top + 'px' });
  document.body.appendChild(ghost);
  cell.classList.add('ph');
  drag = { cell, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, y: e.clientY };
  try { $('#grid').setPointerCapture(e.pointerId); } catch {}
}
function moveDrag(e) {
  if (!drag) return;
  e.preventDefault();
  drag.y = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const under = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.classList.contains('cell') && el !== drag.cell && !el.classList.contains('ghost'));
  if (under) {
    const grid = under.parentNode, cells = [...grid.children];
    const a = cells.indexOf(drag.cell), b = cells.indexOf(under);
    grid.insertBefore(drag.cell, a < b ? under.nextSibling : under);
  }
}
function endDrag() {
  if (!drag) return;
  const order = [...$('#grid .grid').children].map(c => c.dataset.id);
  const map = Object.fromEntries(S.posts.map(p => [p.id, p]));
  S.posts = order.map(id => map[id]); normalize();
  drag.ghost.remove(); drag.cell.classList.remove('ph'); drag = null;
  save(); renderGrid();
}
(function autoscroll() {
  if (drag) { const h = innerHeight; if (drag.y < 110) scrollBy(0, -10); else if (drag.y > h - 110) scrollBy(0, 10); }
  requestAnimationFrame(autoscroll);
})();

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch {
    const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = 0;
    document.body.appendChild(a); a.select(); a.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); } catch {} a.remove();
  }
  toast('Скопійовано ✓');
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
async function shareFiles(blobs, base) {
  const files = blobs.map((b, i) => new File([b], `${base}${blobs.length > 1 ? '-' + (i + 1) : ''}.jpg`, { type: 'image/jpeg' }));
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  files.forEach(f => download(f, f.name));
  toast('Фото збережено у файли');
}

async function sharePost(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return;
  const blobs = []; for (const im of p.imgs) { const b = await imgGet(im); if (b) blobs.push(b); }
  shareFiles(blobs, 'post-' + (S.posts.length - S.posts.indexOf(p)));
}
function renderMove() {
  const p = S.profile;
  const order = S.posts.slice().reverse();     // публікуємо від найстарішого (внизу сітки) до найновішого (зверху)
  const left = order.filter(x => !x.done).length;
  $('#v-move').innerHTML = `
    <h2>1. Профіль</h2>
    <p class="hint">Скопіюй текст і встав у «Редагувати профіль» в Instagram.</p>
    <div class="card">
      ${[['Ім’я користувача', p.username], ['Ім’я', p.name], ['Біо', p.bio], ['Посилання', p.link]].map(([l, v], i) =>
        `<div class="field"><div><b>${l}</b><div class="v">${esc((v || '—').split('\n')[0])}</div></div><button class="btn" data-act="copyProf" data-i="${i}">Копіювати</button></div>`).join('')}
      <div class="field"><div><b>Фото профілю</b></div><button class="btn" data-act="shareAv">Зберегти / надіслати</button></div>
    </div>
    <h2>2. Дописи по порядку</h2>
    <p class="hint">Instagram показує найновіше зверху, тому викладати треба <b>знизу вгору</b>: спершу №1 (найнижчий у сітці), потім №2 і так далі — і сітка в реальному профілі стане такою ж, як тут.${order.length ? ` Залишилось: <b>${left}</b> з ${order.length}.` : ''}</p>
    ${order.length ? order.map((x, i) => `
      <div class="card step ${x.done ? 'done' : ''}">
        <div class="th" style="background-image:url(${urls[x.imgs[0]] || ''})"></div>
        <div class="tx">
          <div class="t">№${i + 1}${x.imgs.length > 1 ? ` · ${x.imgs.length} фото` : ''}${x.pinned ? ' · 📌 потім закріпити' : ''}</div>
          <div class="cap">${esc(x.caption) || '<i>без підпису</i>'}</div>
          <div class="act">
            <button class="btn" data-act="copyCap" data-id="${x.id}">Підпис</button>
            <button class="btn" data-act="sharePost" data-id="${x.id}">Фото</button>
            <button class="btn ${x.done ? 'on' : ''}" data-act="done" data-id="${x.id}">${x.done ? '✓ Опубліковано' : 'Опубліковано?'}</button>
          </div>
        </div>
      </div>`).join('') : '<div class="card empty">Поки немає дописів.</div>'}
    <h2>3. Резервна копія</h2>
    <p class="hint">Усе зберігається тільки в цьому телефоні. Раз на деякий час зберігай копію — наприклад, у «Файли» чи iCloud — і можна відновити її на новому телефоні.</p>
    <div class="btns"><button class="btn" data-act="backup">Зберегти копію</button><button class="btn" data-act="restore">Відновити з копії</button></div>`;
}

function blobToDataURL(b) { return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); }
async function backup() {
  toast('Готую копію…');
  const images = {};
  for (const id of usedImgIds()) { const b = await imgGet(id); if (b) images[id] = await blobToDataURL(b); }
  const blob = new Blob([JSON.stringify({ app: 'ig-editor', v: 1, state: S, images })], { type: 'application/json' });
  const file = new File([blob], `instagram-maket-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  download(file, file.name);
}
async function restore() {
  const [f] = await pickFiles($('#fileBackup')); if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'ig-editor' || !d.state) throw 0;
    if (!confirm('Замінити поточний макет копією з файлу?')) return;
    for (const id of await imgKeys()) await dropImg(id);
    for (const id of Object.keys(urls)) { URL.revokeObjectURL(urls[id]); delete urls[id]; }
    for (const [id, data] of Object.entries(d.images || {})) { const b = await (await fetch(data)).blob(); await imgPut(id, b); urls[id] = URL.createObjectURL(b); }
    S = Object.assign(blank(), d.state);
    await kvSet('state', S); renderAll(); toast('Відновлено ✓');
  } catch { toast('Це не схоже на файл копії'); }
}

/* ---------- events ---------- */
function setTab(t) {
  $('#v-feed').classList.toggle('hide', t !== 'feed');
  $('#v-move').classList.toggle('hide', t !== 'move');
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('a', b.dataset.tab === t));
  if (t === 'move') renderMove();
  scrollTo(0, 0);
}
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  const cell = e.target.closest('.cell');
  if (cell && !reorder && !cell.classList.contains('ghost')) return openViewer(cell.dataset.id);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, id = d.id;
  switch (d.act) {
    case 'tab': setTab(d.tab); break;
    case 'editProfile': editProfile(); break;
    case 'addPhotos': addPhotos(); break;
    case 'toggleReorder': reorder = !reorder; renderGrid(); if (reorder) toast('Тримай фото й перетягуй'); break;
    case 'closeSheet': closeSheet(); break;
    case 'closeViewer': closeViewer(); break;
    case 'editPost': openPost(id); break;
    case 'like': el.classList.toggle('lk-on'); break;
    case 'saveMark': el.classList.toggle('sv-on'); break;
    case 'more': { const fc = el.closest('.fc'); fc.querySelector('.short').classList.add('hide'); el.classList.add('hide'); fc.querySelector('.full').classList.remove('hide'); break; }
    case 'fake': toast('Це лише макет 🙂'); break;
    case 'toggleClean': { const on = document.body.classList.toggle('clean'); if (on && reorder) { reorder = false; renderGrid(); } break; }
    case 'pickAvatar': pickAvatar(); break;
    case 'editHl': editHl(id); break;
    case 'pickCover': pickCover(); break;
    case 'delHl': delHl(); break;
    case 'mv': movePost(+d.d); break;
    case 'addSlide': addSlide(); break;
    case 'rmSlide': rmSlide(d.img); break;
    case 'delPost': delPost(); break;
    case 'copyProf': copyText([S.profile.username, S.profile.name, S.profile.bio, S.profile.link][+d.i] || ''); break;
    case 'shareAv': shareAvatar(); break;
    case 'copyCap': copyText((S.posts.find(x => x.id === id) || {}).caption || ''); break;
    case 'sharePost': sharePost(id); break;
    case 'done': { const p = S.posts.find(x => x.id === id); p.done = !p.done; save(); renderMove(); break; }
    case 'backup': backup(); break;
    case 'restore': restore(); break;
  }
});
const gridEl = $('#grid');
gridEl.addEventListener('pointerdown', startDrag);
gridEl.addEventListener('pointermove', moveDrag);
gridEl.addEventListener('pointerup', endDrag);
gridEl.addEventListener('pointercancel', endDrag);

/* ---------- init ---------- */
(async function init() {
  try {
    const saved = await kvGet('state');
    if (saved) S = Object.assign(blank(), saved);
    for (const id of usedImgIds()) { const b = await imgGet(id); if (b) urls[id] = URL.createObjectURL(b); }
    // прибрати «осиротілі» фото
    const used = usedImgIds();
    for (const k of await imgKeys()) if (!used.has(k)) await imgDel(k);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    toast('Сховище недоступне (приватний режим?)');
  }
  renderAll();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
